name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 같은 PR에 연달아 push하면 앞선 리뷰는 버린다.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 공개 저장소라 fork PR에는 시크릿이 전달되지 않는다. 같은 저장소 브랜치만 리뷰한다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # 시크릿이 없으면 액션이 조용히 건너뛰고 job은 초록불로 끝난다. 그 전에 잡는다.
      - name: 토큰 시크릿 확인
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 시크릿이 없다. 'claude setup-token'으로 발급해 저장소 시크릿에 등록할 것."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --comment로 인라인 코멘트를 달려면 이 MCP 툴을 여기서도 허용해야 한다.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
