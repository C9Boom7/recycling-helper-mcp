name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: local:test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # 버전은 package.json의 `packageManager`가 정한다 — 여기에 `version:`을 함께 주면
      # 액션이 "Multiple versions of pnpm specified"로 거부한다. 이미지(corepack)와 CI가
      # 같은 값을 보게 하려고 필드를 넣은 것이라, 출처는 한 곳이어야 맞다.
      - uses: pnpm/action-setup@v4

      # 배포 이미지(Dockerfile)가 node:22라서 CI도 같은 메이저로 맞춘다.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc 두 벌 + 데이터 검증 + 지역 매칭 + MCP 스모크(전부 localhost)
      - run: pnpm local:test

  # 배포 경로는 PlayMCP in KC의 Git 소스 빌드, 즉 이 Dockerfile이다. 그런데 CI가
  # 이미지를 한 번도 만들어 보지 않아서, 이미지에서만 나는 결함은 **재배포 클릭
  # 직후**에야 드러났다. 빌드하고 실제로 띄워 /health까지 친다.
  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - run: docker build -t recycling-helper-mcp:ci .

      - name: /health 응답 확인
        run: |
          set -euo pipefail
          docker run -d --name mcp-ci -p 3000:3000 recycling-helper-mcp:ci
          # 컨테이너가 이미 죽었으면 기다릴 이유가 없다. 부팅 실패야말로 이 잡을
          # 만든 이유인데, 그냥 기다리면 30초를 흘린 뒤 curl 실패로만 끝나 원인이
          # 안 보인다 — 그 자리에서 로그를 찍고 끊는다.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health -o /tmp/health.json; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' mcp-ci)" != "true" ]; then
              echo "컨테이너가 떠 있지 않다. 아래는 컨테이너 로그다."
              docker logs mcp-ci || true
              exit 1
            fi
            sleep 1
          done
          if [ ! -s /tmp/health.json ]; then
            echo "/health가 30초 안에 응답하지 않았다. 아래는 컨테이너 로그다."
            docker logs mcp-ci || true
            exit 1
          fi
          cat /tmp/health.json
          # 데이터가 이미지에 함께 실렸는지까지 본다 — dist/data 복사가 빠지면
          # 서버는 뜨는데 품목이 0개인 채로 응답한다.
          node -e '
            const health = require("/tmp/health.json");
            const expected = require("./src/data/waste-items.json").length;
            if (health.items !== expected) {
              console.error(`health.items=${health.items}, expected ${expected}`);
              process.exit(1);
            }
            console.log(`health.items=${health.items} (ok)`);
          '

      - if: always()
        run: docker rm -f mcp-ci || true
