name: Claude Code

# PR이나 이슈 코멘트에 @claude를 부르면 응답한다.
# 리뷰 지적을 반영시킬 때: PR에 "@claude 리뷰 지적 반영해줘"라고 남기면 브랜치에 커밋한다.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # 시크릿이 없으면 액션이 조용히 건너뛰고 job은 초록불로 끝난다. 그 전에 잡는다.
      - name: 토큰 시크릿 확인
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 시크릿이 없다. 'claude setup-token'으로 발급해 저장소 시크릿에 등록할 것."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"
